[platformio]
src_dir = test

[env:native]
platform = native
test_framework = unity
test_filter = test_host
extra_scripts =
    pre:scripts/coverage.py
    pre:scripts/bbtool_pio.py
custom_bb_board = native
build_flags =
    -O0
    -DUNITY_INCLUDE_DOUBLE
    -DBB_LED_ANIM_MOCK_CLOCK
    -DBB_BUTTON_MOCK_CLOCK
    -DBB_BUTTON_EVENTS_MOCK_CLOCK
    -DCONFIG_BB_EVENT_MAX_TOPICS=64
    -DCONFIG_BB_EVENT_MAX_PAYLOAD=512
    -DCONFIG_BB_LOG_TAG_REGISTRY_MAX=24
    -DCONFIG_BB_OTA_CHECK_CUSTOM_PARSER_BUF_BYTES=8192
    -DBB_EVENT_TESTING
    -DBB_EVENT_ROUTES_TESTING
    -DBB_OTA_CHECK_TESTING
    -DBB_OPENAPI_TESTING
    -DBB_OTA_PULL_TESTING
    -DBB_OTA_HOOKS_TESTING
    -DBB_DISPLAY_TESTING
    -DBB_MDNS_TESTING
    -DBB_SYSTEM_TESTING
    -DBB_WDT_TESTING
    -DBB_TIMER_TESTING
    -DBB_HTTP_TESTING
    -DBB_HTTP_CLIENT_TESTING
    -DBB_TEMP_TESTING
    -DBB_HEALTH_TESTING
    -DBB_HEALTH_SECTION_TESTING
    -DBB_WIFI_TESTING
    -DBB_BOARD_TESTING
    -DBB_POWER_TESTING
    -DBB_I2C_TESTING
    -DBB_FAN_TESTING
    -DCONFIG_BB_FAN_AUTOFAN
    -DBB_MQTT_CLIENT_TESTING
    -DCONFIG_BB_MQTT_CLIENT_KEEPALIVE=120
    -DCONFIG_BB_MQTT_CLIENT_NETWORK_TIMEOUT_MS=30000
    -DCONFIG_BB_MQTT_TLS_ENABLE=1
    -DCONFIG_BB_HTTP_TLS_ENABLE=1
    -DCONFIG_BB_TLS_MUTUAL_ENABLE=1
    -DBB_CLAIM_TESTING
    -DBB_RESPONSE_TESTING
    -DBB_SENSOR_TESTING
    -DCONFIG_BB_STORAGE_HTTP_FACTORY_RESET=1
    ; Kconfig default is y (components/bb_diag_http/Kconfig, B1-1155); host
    ; has no sdkconfig.h, so bb_log_http.c's own #if defined(CONFIG_BB_LOG_ROUTES)
    ; guard around bb_log_register_routes_init() falls through to its
    ; no-op #else stub unless mirrored here (B1-1214) -- needed for
    ; test_route_schema_literals_live.c's live-registry walk to reach
    ; GET/POST /api/log/level's real route descriptors.
    -DCONFIG_BB_LOG_ROUTES=1
    -DBB_STORAGE_HTTP_TESTING
    -DBB_HTTP_BODY_TESTING
    -DBB_TLS_CREDS_TESTING
    -DCONFIG_BB_MEM_ARENA_TLS_BYTES=256
    -DBB_MEM_ARENA_TLS_TESTING
    -DCONFIG_BB_METRICS_PREFIX=\"bb\"
    -DBB_CACHE_TESTING
    -DCONFIG_BB_CACHE_MAX_TOPICS=32
    -DBB_MEM_STATS_ENABLE=1
    -DBB_MEM_TESTING
    -DBB_LOCK_STATS_ENABLE=1
    -DBB_REGISTRY_TESTING
    -DBB_SERIALIZE_FORMAT_TESTING
    -DBB_DATA_TESTING
    -DBB_DIAG_SECTION_TESTING
    -DBB_DIAG_STORAGE_NVS_TESTING
    ; B1-1059 PR-3 batch 1 -- same runtime-compose-from-meta pattern as the
    ; storage/nvs pilot above, for storage/partitions, meminfo, rings, and
    ; websocket.
    -DBB_DIAG_STORAGE_PARTITIONS_TESTING
    -DBB_DIAG_MEMINFO_TESTING
    -DBB_RING_DIAG_TESTING
    -DBB_WS_SERVER_DIAG_TESTING
    ; B1-1059 PR-3 batch 2 -- same runtime-compose-from-meta pattern, for
    ; diag/wifi.
    -DBB_WIFI_HTTP_DIAG_TESTING
    ; B1-1059 PR-3 batch 3 -- same runtime-compose-from-meta pattern, for
    ; /api/sensors/{fan,power,thermal}.
    -DBB_SENSOR_HTTP_WIRE_TESTING
    -DBB_HTTP_SECTION_TESTING
    ; Kconfig defaults are 1536/3072 (components/bb_diag/Kconfig, B1-767 PR9);
    ; host has no sdkconfig, so the bb_diag_section_priv.h bridge falls
    ; through to its bare fallback (512/1024) unless mirrored here -- the
    ; storage/nvs and storage/partitions sections' snapshots (~1.3KB/~1KB at
    ; their default caps) need the raised scratch bound to register at all.
    -DCONFIG_BB_DIAG_SECTION_SCRATCH_BYTES=1536
    -DCONFIG_BB_DIAG_SECTION_RENDER_BUF_BYTES=3072
    -DBB_DATA_HTTP_TESTING
    ; B1-1482: Kconfig default is 3/2 (components/bb_data_http/Kconfig) --
    ; mirrored explicitly here (host has no sdkconfig.h) rather than falling
    ; through to bb_data_http_common.c's bare #ifndef fallback (2/2, the
    ; PRE-B1-1482 value) so test_bb_data_http.c's blocking-client-budget
    ; tests can prove a spare (3rd) fd-table slot exists once the 2-client
    ; blocking budget is exhausted -- the exact "2 blocking + 1 non-blocking"
    ; shape floor's own sdkconfig.defaults pins for its real MQTT egress
    ; slot (examples/floor/sdkconfig.defaults).
    -DCONFIG_BB_DATA_HTTP_MAX_CLIENTS=3
    -DCONFIG_BB_DATA_HTTP_MAX_BLOCKING_CLIENTS=2
    -DBB_QUEUE_REGISTRY_TESTING
    -DBB_QUEUE_TESTING
    -DBB_TASK_REGISTRY_TESTING
    -DBB_TASK_TESTING
    -DCONFIG_BB_TASK_BASE_MAX=8
    ; Kconfig default is 1 (components/bb_fsm/Kconfig); overridden to 2 here
    ; so test_bb_fsm.c can prove the timer-arm seam is genuinely N-ready
    ; (multi-slot arm/overflow/disarm), not hardcoded to a single scalar.
    -DCONFIG_BB_FSM_MAX_TIMERS=2
    -DBB_UDP_CLIENT_TESTING
    -DBB_COLLECTION_TESTING
    -DBB_STORAGE_NVS_TESTING
    -DBB_STORAGE_RTC_TESTING
    -DBB_LIFECYCLE_TESTING
    ; Kconfig default is 8 (components/bb_lifecycle/Kconfig); the host env's
    ; own BB_BQUEUE_MAX_CAPACITY=4 (below) caps every host bb_bqueue instance
    ; at capacity 4, so bb_lifecycle_async's lazily-created queue is pinned
    ; down to fit -- test_bb_lifecycle_async.c's full-queue-drop scenario
    ; also stays cheap (3 items to fill, not 8).
    -DCONFIG_BB_LIFECYCLE_ASYNC_QUEUE_DEPTH=3
    -DBB_TCP_CLIENT_TESTING
    ; Kconfig default is 1 (components/bb_tcp_client/Kconfig); overridden to 2
    ; here so test_bb_tcp_client.c's pool-exhaustion test proves the free-slot
    ; scan is genuinely N-ready, not hardcoded to a single instance.
    -DBB_TCP_CLIENT_MAX_INSTANCES=2
    -DBB_BQUEUE_TESTING
    ; Kconfig defaults are capacity=16/item_bytes=64; pinned down here so
    ; test_bb_bqueue.c's MPSC fill-to-capacity/drop-on-full scenarios stay
    ; cheap (small, fixed thread counts) rather than needing 16 producers.
    ; MAX_INSTANCES is left at its Kconfig default (2 -- TaipanMiner needs
    ; exactly two, work + result); bb_bqueue_test_reset() frees every
    ; instance between tests, so no test needs a third slot to prove the
    ; free-slot scan is N-ready.
    -DBB_BQUEUE_MAX_CAPACITY=4
    -DBB_BQUEUE_MAX_ITEM_BYTES=16
    ; BB_SERIALIZE_META_HOST (B1-1059 PR-2a) -- the ONLY thing that ever
    ; unconditionally sets this define is a host build (this native env). It
    ; feeds bb_serialize_meta.h's BB_SERIALIZE_META_SHIP gate (device-
    ; shippable PR, B1-1059) -- co-located bb_serialize_desc_meta_t tables
    ; inside components/<name>/ (e.g. components/bb_wifi_http/
    ; bb_wifi_http_wire.c) compile to zero bytes on the ESP-IDF/device build
    ; unless CONFIG_BB_OPENAPI_RUNTIME_META is also set (Kconfig, default
    ; off), while a host test/generator built here always sees the real
    ; table. See test_bb_wifi_http_wire_meta_golden.c for the exemplar this
    ; proves out.
    -DBB_SERIALIZE_META_HOST=1
    -lm
lib_deps = https://github.com/DaveGamble/cJSON.git#v1.7.18
test_build_src = yes
build_src_flags = -Werror

; Second native test env: builds the whole component graph identically to
; [env:native] EXCEPT it omits -DBB_LOCK_STATS_ENABLE=1, so BB_LOCK_STATS_ENABLE
; falls through to its C default (0) — the same value the Kconfig bridge ships
; by default (CONFIG_BB_LOCK_STATS_ENABLE, default n). test_host/test_bb_lock.c
; only ever exercises the *runtime*-disabled path (built with
; BB_LOCK_STATS_ENABLE=1); this env is the only place CI proves the
; *compile-time*-disabled path — the one that actually ships by default —
; compiles cleanly and behaves correctly. Minimal smoke test only
; (test/test_lock_stats_off/); does not re-run the full test_host suite.
[env:native_lock_stats_off]
extends = env:native
test_filter = test_lock_stats_off
build_flags =
    ${env:native.build_flags}
    -UBB_LOCK_STATS_ENABLE
    ; This narrow lock-stats-off smoke doesn't build test_bb_serialize_meta_*
    ; (test_filter excludes test_host) -- undefine the guard here too so
    ; components/bb_wifi_http's co-located meta table (gated on
    ; BB_SERIALIZE_META_SHIP, which OR's this define in) compiles out, same
    ; as the ESP-IDF/device build with CONFIG_BB_OPENAPI_RUNTIME_META off.
    -UBB_SERIALIZE_META_HOST

; Third native test env: proves the CONFIG_BB_OPENAPI_RUNTIME_META=y runtime-
; compose path (B1-1059 PR-2 pilot, bb_diag_storage_nvs) actually compiles
; and wires correctly -- gated DIRECTLY on this Kconfig symbol, distinct
; from BB_SERIALIZE_META_HOST (which env:native sets unconditionally for its
; own golden-test purposes and must NOT also flip this section's route onto
; the runtime-compose path). Minimal wiring smoke only
; (test/test_host_openapi_meta_on/); does not re-run the full test_host
; suite. BB_DIAG_STORAGE_NVS_TESTING is already set by env:native above and
; inherited here via `extends`.
[env:native_openapi_runtime_meta]
extends = env:native
test_filter = test_host_openapi_meta_on
build_flags =
    ${env:native.build_flags}
    -DCONFIG_BB_OPENAPI_RUNTIME_META=1
    -DBB_DIAG_STORAGE_NVS_TESTING
    ; B1-1059 PR-3 batch 1 siblings -- see the matching comment in
    ; env:native above.
    -DBB_DIAG_STORAGE_PARTITIONS_TESTING
    -DBB_DIAG_MEMINFO_TESTING
    -DBB_RING_DIAG_TESTING
    -DBB_WS_SERVER_DIAG_TESTING
    -DBB_WIFI_HTTP_DIAG_TESTING
    -DBB_SENSOR_HTTP_WIRE_TESTING
    ; BB_SERIALIZE_META_TESTING (B1-1059 PR-b) -- engine-level fail-injection
    ; seam (bb_serialize_meta_test.h) shared by every compose-at-init
    ; call site across the epic; only this env's wiring tests need it.
    -DBB_SERIALIZE_META_TESTING

; Fourth native test env: proves CONFIG_BB_WIFI_PROV_GATE_DISABLE=1 -- the
; bb_http_prov_gate escape hatch -- actually compiles and behaves correctly.
; test_host's own env never defines this symbol, so that branch is
; preprocessed out of every other env entirely; this is the ONLY place CI
; compiles it in. Minimal wiring smoke only (test/test_prov_gate_disable/);
; does not re-run the full test_host suite.
[env:native_prov_gate_disable]
extends = env:native
test_filter = test_prov_gate_disable
build_flags =
    ${env:native.build_flags}
    -DCONFIG_BB_WIFI_PROV_GATE_DISABLE=1
