name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: github.event_name == 'pull_request'
    uses: dangernoodle-io/.github/.github/workflows/path-changes.yml@main
    with:
      filters: |
        firmware:
          # dorny/paths-filter ORs a filter's patterns together (.some()), so a
          # standalone '!**/*.md' entry cannot subtract from what the globs below
          # already matched -- it only ADDS "any non-.md file". Exclude markdown
          # inside each glob instead (picomatch extglob, {dot: true}).
          # If a .md is ever embedded as a build asset (CMake EMBED_FILES), revisit.
          - 'components/**/!(*.md)'
          - 'platform/**/!(*.md)'
          - 'examples/**/!(*.md)'
          - 'cmake/**/!(*.md)'
          - 'CMakeLists.txt'
          - 'platformio.ini'
          - 'sdkconfig/**/!(*.md)'
          - 'Makefile'
          - 'bbtool.toml'
          - 'scripts/bbtool.py'
          - 'scripts/bbtool_pio.py'
          - 'scripts/bbtool/**/!(*.md)'
          - 'scripts/copy_artifacts.py'
          - '.github/workflows/build.yml'
        python:
          - 'scripts/**'
          - '.github/workflows/build.yml'
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Forbidden-pattern lint
        run: make check
  test:
    uses: dangernoodle-io/.github/.github/workflows/pio-test.yml@main
    with:
      # B1-1258: uncovered_branch is a LOCAL pre-push aid only, not a CI gate --
      # branch attribution (which gcov CFG edges a compound conditional splits
      # into, and which count as "taken") is gcc-major-dependent (PR #850), and
      # the committed branch baseline is seeded on a dev machine's gcc, not
      # CI's. Coveralls (running under the PR's own CI toolchain) remains the
      # sole CI authority for branch coverage; uncovered_line ratcheting is
      # unaffected and still gates CI. This runs in the SAME job as (and
      # before) the "Test and coverage" step below, via $GITHUB_ENV, so no
      # change to the shared pio-test.yml workflow is needed.
      #
      # warning_fence_host (B1-1420 PR2): this job already builds the host
      # env with a genuine-GNU gcc for coverage -- scripts/warn_scan.sh
      # captures a real `-Wall -Wno-error` build's diagnostics into a live,
      # uncommitted report, then the fence check reads it and fails the
      # step (hence the job) on any net-new warning. warn_scan.sh cleans
      # its own build dir afterward so the real -Werror + --coverage build
      # below starts fresh, untouched by the scan.
      pre-build-script: |
        echo "COVERAGE_GATE_LINES_ONLY=1" >> "$GITHUB_ENV"
        scripts/warn_scan.sh host
        BB_WARNING_FENCE_STRICT=1 python3 scripts/bbtool.py fence --root . --family warning_fence_host
    secrets: inherit
  py-tests:
    needs: changes
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.changes), 'python')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python test deps
        run: pip install -r scripts/bbdevice/requirements.txt
      - name: Python tooling tests
        run: make test-py
  smoke:
    needs: [test, changes]
    if: github.event_name == 'pull_request' && contains(fromJSON(needs.changes.outputs.changes), 'firmware')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # r4_wifis3 / uno_cc3000 temporarily excluded — local arm64 toolchain dance; restore after toolchain fix (see backlog)
        example: [elecrow-p4-hmi7, esp32, esp32-cache-sweep, esp32-diag-headless, esp32-no-banner, esp32-sw-wdt, esp32-core-claim, esp32c3, tdongle]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pio
      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install tools
        run: pip install platformio
      - name: Examples smoke build
        run: make smoke-${{ matrix.example }}
      - name: warning_fence_firmware -- capture + fence a real -Wall esp32 build (B1-1420 PR2)
        if: matrix.example == 'esp32'
        run: |
          scripts/warn_scan.sh firmware
          BB_WARNING_FENCE_STRICT=1 python3 scripts/bbtool.py fence --root . --family warning_fence_firmware
  summary:
    if: always()
    needs: [check, test, smoke, py-tests, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: dangernoodle-io/.github/.github/actions/ci-result-gate@main
        with:
          required: check=${{ needs.check.result }} test=${{ needs.test.result }}
          optional: smoke=${{ needs.smoke.result }} py-tests=${{ needs.py-tests.result }} changes=${{ needs.changes.result }}
